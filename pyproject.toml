# Tool configuration only (lint + test). Dependencies live in src/requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
# Bản dịch đề và kế hoạch có code mẫu; ruff format không được sửa các file đó.
extend-exclude = ["Requirements", "Plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-ra"
