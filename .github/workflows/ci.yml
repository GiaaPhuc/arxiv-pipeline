name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements-ci.txt
      - run: pip install -r src/requirements-ci.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --durations=10
      - name: Block data and secrets
        run: |
          if git ls-files | grep -E '^data/|\.parquet$|\.sqlite$|\.tar\.gz$|\.gz$|(^|/)\.env$'; then
            echo "Data/secret files are tracked - remove them."; exit 1
          fi
